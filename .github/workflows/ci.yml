name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint · types · tests · contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy (strict)
        run: mypy app
      - name: Pytest
        run: pytest
      - name: OpenAPI contract is committed and current
        run: python -m app.scripts.export_openapi --check
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable
      - name: Alembic migrations match the models
        env:
          BIOPILOT_DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: frontend (contract · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Runtime dependency vulnerabilities (npm audit, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Generated API types match openapi.json
        run: npm run check:api
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: e2e (Playwright · reference + lab seed)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e .
      - name: Install frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npm run e2e
